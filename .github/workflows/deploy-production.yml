name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.EC2_PORT }} -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -p ${{ secrets.EC2_PORT }} ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            cd /home/ubuntu/Gemellery
            git fetch origin
            git reset --hard HEAD
            git clean -fd
            git checkout main
            git pull origin main

            cd /home/ubuntu/Gemellery/frontend
            npm install
            npm run build
            sudo rm -rf /var/www/html/*
            sudo cp -r dist/* /var/www/html/

            cd /home/ubuntu/Gemellery/backend
            npm install
            npm run build

            if [ -d "src/contracts" ]; then
              mkdir -p dist/contracts
              cp -r src/contracts/* dist/contracts/ || true
            fi

            pm2 restart gem-backend --update-env
            sudo systemctl reload nginx
          EOF
